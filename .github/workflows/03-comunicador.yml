name: Comunicador de la legión

on:
    workflow_dispatch:
        inputs:
            villano:
                description: ¿Qué villano envía el mensaje?
                required: true
                type: choice
                options:
                    - Lex Luthor
                    - Magneto
                    - Joker
                    - Mystique
                    - Brainiac

            mensaje:
                description: "Mensaje para el consejo"
                required: true
                default: 'La misión fue un exito'

            prioridad:
                description: 'Nivel de prioridad'
                required: true
                type: choice
                options:
                    - Normal
                    - Alta
                    - Critica

jobs:
    transmitir-mensaje:
        runs-on: ubuntu-latest

        steps:
            - name: Instalar el transmisor de la legion
              run: sudo apt-get install -y cowsay

            - name: Imprimir inputs
              run: |
                echo "========================================="
                echo "       Transmision interceptada"
                echo "========================================="
                echo ""
                echo "De: ${{ inputs.villano }}"
                echo ""
                echo "Fecha $(date -u +"%d/%m/%Y - %H:%M UTC")"
                echo "------------Mensaje-------------------------"
                cowsay -f eyes "${{ inputs.mensaje }}"
                echo ""
                echo "----- ${{ inputs.villano }}"
                echo "......"
